  # HISTORICAL LANDSLIDE DATA (VERIFIED)
  # ==================================================
  - id: gsi_landslides
    category: historical_landslides
    dataset_name: "GSI Historical Landslide Inventory"
    provider: "Geological Survey of India (GSI)"
    description: "33,904 field-validated landslide events extracted from GSI published inventory"
    spatial_resolution: "Point locations from field surveys"
    temporal_resolution: "Historical events spanning decades"
    coverage: "8 NER states: Arunachal Pradesh, Assam, Manipur, Meghalaya, Mizoram, Nagaland, Sikkim, Tripura"
    format: "CSV (extracted from PDF), GeoJSON for API"
    access_method: "Local file repository (data/raw/landslides/)"
    source_url: "https://www.gsi.gov.in/ (original publication)"
    license: "Government of India / Public Domain"
    verification_status: "VERIFIED"
    local_path: "data/raw/landslides/33,904 field-validated inventory records.pdf"
    ingestion_status: "COMPLETED"
    notes: "PDF extracted to CSV via OCR/text-extraction; 33,904 records with coordinates from field surveys"
    geometry_fields:
      - latitude
      - longitude
    crs: "EPSG:4326"
    data_quality: "OBSERVED - field-validated event locations"

